services:
  # ----------------------------------------------------------------------------
  # MongoDB 8 — primary database
  # ----------------------------------------------------------------------------
  mongo:
    image: mongo:8.0
    container_name: forgewise-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------------------
  # FastAPI backend
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: forgewise-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - ./apps/api/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_REQUIRED_ON_STARTUP: "true"
      # host.docker.internal reaches an Ollama running on the host machine
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "8000:8000"
    volumes:
      - api_storage:/app/storage

  # ----------------------------------------------------------------------------
  # Next.js frontend (proxies /api/v1 to the api service)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://api:8000
    container_name: forgewise-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  mongo_data:
  api_storage:
