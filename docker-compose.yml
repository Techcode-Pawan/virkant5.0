services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 with pgvector extension
  # ----------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: forgewise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-forgewise_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forgewise_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis 7 for rate-limiting and task caching
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: forgewise-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # FastAPI Application Backend
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: forgewise-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APPLICATION_ENV: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/forgewise_db
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/app:/app/app
      - storage_data:/app/storage_data

  # ----------------------------------------------------------------------------
  # Next.js 15 App Router Frontend
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: forgewise-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8000
      NEXT_PUBLIC_APP_NAME: "ForgeWise AI"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  storage_data:
